services:
  - type: web
    name: joburg-employee-register
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/attendance.sqlite
      - key: APP_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "1"